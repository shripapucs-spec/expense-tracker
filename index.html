<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Local-first personal expense tracker (INR). Works offline. Your data stays on your device.">
  <title>Expense Tracker</title>

  <!-- iOS PWA: installable on Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sideNav" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-logo">₹</div>
        <div class="brand-name">Expense<br>Tracker</div>
      </div>
      <div id="navLinks"></div>
      <div class="side-footer">Local-first · Offline<br>Your data stays on device</div>
    </aside>

    <div id="main">
      <header id="pageHeader">
        <h1 id="pageTitle">Dashboard</h1>
        <button id="quickAdd" class="btn btn-primary btn-compact" type="button" aria-label="Add expense">＋ Add</button>
      </header>

      <main id="view" tabindex="-1"></main>
    </div>

    <nav id="bottomNav" aria-label="Main navigation"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
